name: Windows Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish CLI
        shell: pwsh
        run: dotnet publish .\AmongUsAchievementUnlocker.csproj -c Release -r win-x64 --self-contained false -o .\publish\cli
      - name: Publish GUI
        shell: pwsh
        run: dotnet publish .\gui\AmongUsAchievementUnlocker.Gui.csproj -c Release -r win-x64 --self-contained false -o .\publish
      - name: Exclude proprietary native Steamworks libraries
        shell: pwsh
        run: |
          Get-ChildItem .\publish -Filter steam_api*.dll -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          if (Get-ChildItem .\publish -Filter steam_api*.dll -Recurse -ErrorAction SilentlyContinue) {
            throw 'Native Steamworks DLL must not be distributed in this artifact.'
          }
      - name: Include setup instructions
        shell: pwsh
        run: Copy-Item .\docs\WINDOWS-SETUP.md .\publish\START-HERE.md
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path .\publish\* -DestinationPath .\AmongUsAchievementUnlocker-win-x64-rc.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AmongUsAchievementUnlocker-win-x64-rc
          path: AmongUsAchievementUnlocker-win-x64-rc.zip
          if-no-files-found: error
